<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="header">
        <h2>PolyView+</h2>
    </div>
    
    <div class="settings">
        <div class="settings-row">
            <svg class="info-icon" data-info="maxItems" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
            <span class="label-text">Max Visible Markets</span>
            <input type="number" id="maxItems" min="2" max="999" />
        </div>

        <div class="toggle-row">
            <svg class="info-icon" data-info="masonry" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
            <span class="label-text">Masonry Layout</span>
            <label class="toggle-switch">
                <input type="checkbox" id="masonryEnabled" />
                <span class="slider"></span>
            </label>
        </div>

        <div class="toggle-row">
            <svg class="info-icon" data-info="sorting" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
            <span class="label-text">Market Price Sorting</span>
            <label class="toggle-switch">
                <input type="checkbox" id="customSorting" />
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <!-- Link Launcher & Editor -->
    <div class="launcher-row" id="viewMode">
        <button id="openBtn" class="primary-btn">Open Polymarket</button>
        <button id="editBtn" class="icon-btn" title="Edit Link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
        </button>
    </div>

    <div class="launcher-row hidden" id="editMode">
        <input type="text" id="linkInput" placeholder="https://polymarket.com..." />
        <button id="saveBtn" class="icon-btn success" title="Save">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </button>
        <button id="cancelBtn" class="icon-btn danger" title="Cancel">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
    </div>

    <!-- Save indicator -->
    <div id="saveIndicator" class="save-indicator hidden">
        Settings saved successfully!
    </div>

    <!-- Hard Reload Button -->
    <button id="reloadBtn" class="outline-btn hidden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="mr-2"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
        Apply Changes & Reload
    </button>

    <!-- Info Tooltip -->
    <div class="info-tooltip hidden" id="infoTooltip">
        <span id="tooltipText"></span>
    </div>

    <script src="popup.js"></script>
</body>
</html>
