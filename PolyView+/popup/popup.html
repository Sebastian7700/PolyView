<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="header">
        <h2>PolyView+</h2>
    </div>
    
    <div class="settings">
        <label>
            <span>Max Visible Markets:</span>
            <input type="number" id="maxItems" min="2" max="999" />
        </label>
        
        <div class="warning-box">
            <svg class="icon-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
            <span>Note: Some API responses limit to 5 markets.</span>
            <div class="tooltip">An Event is the overarching topic (e.g. World Cup). Markets are the bettable sub-options (e.g. France, Spain). Polymarket's backend sometimes caps the provided market data to 5.</div>
        </div>

        <label class="toggle-row">
            <span>Masonry Layout</span>
            <div class="toggle-switch">
                <input type="checkbox" id="masonryEnabled" />
                <span class="slider"></span>
            </div>
        </label>
    </div>

    <!-- Link Launcher & Editor -->
    <div class="launcher-row" id="viewMode">
        <button id="openBtn" class="primary-btn">Open Polymarket</button>
        <button id="editBtn" class="icon-btn" title="Edit Link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
        </button>
    </div>

    <div class="launcher-row hidden" id="editMode">
        <input type="text" id="linkInput" placeholder="https://polymarket.com..." />
        <button id="saveBtn" class="icon-btn success" title="Save">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </button>
        <button id="cancelBtn" class="icon-btn danger" title="Cancel">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
    </div>

    <!-- Hard Reload Button -->
    <button id="reloadBtn" class="outline-btn hidden">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="mr-2"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
        Apply Changes & Reload
    </button>

    <script src="popup.js"></script>
</body>
</html>
